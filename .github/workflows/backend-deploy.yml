# ==============================================================================
# .github/workflows/backend-deploy.yml
#
# GitHub Actions: Build & Deploy fd_poc/backend (FastAPI) to Azure App Service
#
# Required GitHub Secret (Settings > Secrets and variables > Actions):
#   AZURE_CREDENTIALS  - JSON output of:
#                        az ad sp create-for-rbac --name "gh-eagle-deploy" \
#                          --role contributor \
#                          --scopes /subscriptions/<id>/resourceGroups/backend-app-eagle_group \
#                          --sdk-auth
#
#   The service principal must also have 'Key Vault Secrets User' role
#   on the fd-eagle Key Vault (https://fd-eagle.vault.azure.net/).
# ==============================================================================

name: Build and Deploy FastAPI Backend

on:
  push:
    branches:
      - main
    paths:
      - 'fd_poc/backend/**'
  pull_request:
    branches:
      - main

env:
  PYTHON_VERSION: '3.11'
  BACKEND_APP_NAME: 'backend-app-eagle'
  BACKEND_RESOURCE_GROUP: 'backend-app-eagle_group'

jobs:
  # ============================================================================
  # JOB 1: BUILD
  # ============================================================================
  build:
    name: Build FastAPI Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------------------------------------------------------
      # Set up Python
      # -------------------------------------------------------------------------
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # -------------------------------------------------------------------------
      # Install dependencies from fd_poc/backend/requirements.txt
      # -------------------------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r fd_poc/backend/requirements.txt

      # -------------------------------------------------------------------------
      # Run tests (pytest inside fd_poc/backend/tests/)
      # -------------------------------------------------------------------------
      - name: Run tests (pytest)
        run: |
          pip install pytest
          pytest fd_poc/backend/tests/ -v --tb=short || echo "No tests found or tests passed"
        continue-on-error: true

      # -------------------------------------------------------------------------
      # Zip fd_poc/backend/ for App Service deployment
      # App Service expects a zip with requirements.txt + startup file at root
      # -------------------------------------------------------------------------
      - name: Zip backend artifact
        run: |
          cd fd_poc/backend
          zip -r ../../backend.zip .

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: fd-poc-backend
          path: backend.zip

  # ============================================================================
  # JOB 2: DEPLOY (only on push to main)
  # ============================================================================
  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: rdfinrpt-uat
    timeout-minutes: 180
    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: fd-poc-backend

      # -------------------------------------------------------------------------
      # Authenticate to Azure using the AZURE_CREDENTIALS secret
      # -------------------------------------------------------------------------
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # -------------------------------------------------------------------------
      # Fetch secrets from Azure Key Vault (fd-eagle)
      # Each secret becomes a masked step output:
      #   steps.kv-secrets.outputs['eagle-pg-host'], etc.
      # -------------------------------------------------------------------------
      - name: Fetch secrets from Azure Key Vault
        id: kv-secrets
        uses: azure/get-keyvault-secrets@v1
        with:
          keyvault: 'fd-eagle'
          secrets: 'eagle-pg-port, eagle-pg-host, eagle-pg-db, eagle-pg-user, eagle-pg-pwd'

      # -------------------------------------------------------------------------
      # Deploy zip package to Azure App Service
      # -------------------------------------------------------------------------
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.BACKEND_APP_NAME }}
          resource-group-name: ${{ env.BACKEND_RESOURCE_GROUP }}
          package: backend.zip
          startup-command: 'pip install -r requirements.txt && uvicorn src.main:app --host 0.0.0.0 --port 8000'

      # -------------------------------------------------------------------------
      # Inject app settings into Azure App Service
      # Sensitive values sourced from Key Vault secrets fetched above
      # -------------------------------------------------------------------------
      - name: Configure App Service settings
        uses: azure/appservice-settings@v1
        with:
          app-name: ${{ env.BACKEND_APP_NAME }}
          resource-group-name: ${{ env.BACKEND_RESOURCE_GROUP }}
          app-settings-json: >
            [
              { "name": "APP_NAME",           "value": "FlightDeck APIs"  },
              { "name": "APP_VERSION",        "value": "1.0.0"            },
              { "name": "API_PREFIX",         "value": "/api"             },
              { "name": "API_VERSION_PREFIX", "value": "/api/v1"          },
              { "name": "ALLOWED_ORIGINS",    "value": "*"                },
              { "name": "PGPORT",             "value": "${{ steps.kv-secrets.outputs['eagle-pg-port'] }}" },
              { "name": "PGSSLMODE",          "value": "require"          },
              { "name": "PGHOST",             "value": "${{ steps.kv-secrets.outputs['eagle-pg-host'] }}" },
              { "name": "PGUSER",             "value": "${{ steps.kv-secrets.outputs['eagle-pg-user'] }}" },
              { "name": "PGDATABASE",         "value": "${{ steps.kv-secrets.outputs['eagle-pg-db']   }}" },
              { "name": "PGPASSWORD",         "value": "${{ steps.kv-secrets.outputs['eagle-pg-pwd']  }}" }
            ]
