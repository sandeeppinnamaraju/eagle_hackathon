# =============================================================================
# frontend-pipeline.yml
#
# ADO Pipeline: Build & Deploy frontend (TanStack Start + Vite) to Azure App Service
#
# Variable Group (ADO Library > Variable Groups): fd-group
# Variables inherited from the group:
#   $(subscription-id)       - Azure subscription ID
#   $(resource-group-name)   - Azure Resource Group name
#
# Inline variables (defined below — update before running):
#   frontend-app-name        - Azure App Service name for the frontend
#
# Inline variables:
#   eagle-backend-url        - Backend App Service URL (not sensitive, defined inline)
#
# Service Connection (ADO Project Settings > Service Connections):
#   fd_ser_con               - ARM service connection
# =============================================================================

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - src/**
      - package.json
      - vite.config.ts
      - tsconfig.json

pr:
  branches:
    include:
      - main

variables:
  # -------------------------------------------------------------------------
  # Variable group from ADO Library (Pipelines > Library > fd-group)
  # -------------------------------------------------------------------------
  - group: fd-group
  # -------------------------------------------------------------------------
  # App-specific variables — update once App Service is provisioned
  # -------------------------------------------------------------------------
  - name: frontend-app-name
    value: 'eagle-frontend01'
  - name: frontend-resource-group
    value: 'GSK-Eagle-POC'
  - name: nodeVersion
    value: '20.x'
  - name: runDeploy
    value: 'true'    # Deploy enabled
  - name: eagle-backend-url
    value: 'https://eagle-backend01.azurewebsites.net'

# =============================================================================
# STAGE 1: BUILD
# =============================================================================
stages:
  - stage: Build
    displayName: 'Build TanStack Start Frontend'
    jobs:
      - job: BuildFrontend
        displayName: 'Install dependencies, run tests & build'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          # -------------------------------------------------------------------
          # Set up Node.js (required for tooling even though bun is the runtime)
          # -------------------------------------------------------------------
          - task: NodeTool@0
            displayName: 'Use Node.js $(nodeVersion)'
            inputs:
              versionSpec: $(nodeVersion)

          # -------------------------------------------------------------------
          # Install bun package manager
          # -------------------------------------------------------------------
          - script: |
              curl -fsSL https://bun.sh/install | bash
              echo "##vso[task.prependpath]$HOME/.bun/bin"
            displayName: 'Install bun'

          # -------------------------------------------------------------------
          # Install dependencies from package.json (respects bun.lock)
          # -------------------------------------------------------------------
          - script: |
              bun install
            displayName: 'bun install'

          # -------------------------------------------------------------------
          # Run tests (vitest)
          # -------------------------------------------------------------------
          - script: |
              bun run test || echo "No tests found or tests passed"
            displayName: 'Run tests (vitest)'
            continueOnError: true

          # -------------------------------------------------------------------
          # Build the frontend with vite
          # -------------------------------------------------------------------
          - script: |
              bun run build
            displayName: 'Build frontend (vite build)'

          # -------------------------------------------------------------------
          # Generate a zero-dependency Node.js static file server.
          # Serves dist/client as a SPA (falls back to index.html for all routes).
          # Uses process.env.PORT provided by Azure App Service at runtime.
          # -------------------------------------------------------------------
          - script: |
              cat > $(System.DefaultWorkingDirectory)/staticserver.cjs << 'EOF'
              const http = require('http');
              const fs = require('fs');
              const path = require('path');
              const port = process.env.PORT || 8080;
              const root = path.join(__dirname, 'dist', 'client');
              const mime = {
                '.html': 'text/html', '.js': 'application/javascript',
                '.css': 'text/css', '.json': 'application/json',
                '.png': 'image/png', '.jpg': 'image/jpeg',
                '.svg': 'image/svg+xml', '.ico': 'image/x-icon',
                '.woff': 'font/woff', '.woff2': 'font/woff2', '.ttf': 'font/ttf'
              };
              console.log('__dirname:', __dirname);
              console.log('root:', root);
              console.log('root exists:', fs.existsSync(root));
              if (fs.existsSync(root)) {
                console.log('root contents:', fs.readdirSync(root));
              } else {
                const distPath = path.join(__dirname, 'dist');
                console.log('dist exists:', fs.existsSync(distPath));
                if (fs.existsSync(distPath)) console.log('dist contents:', fs.readdirSync(distPath));
              }
              console.log('index.html exists:', fs.existsSync(path.join(root, 'index.html')));
              http.createServer((req, res) => {
                const url = req.url.split('?')[0];
                let file = path.join(root, url === '/' ? 'index.html' : url);
                fs.readFile(file, (err, data) => {
                  if (err) {
                    fs.readFile(path.join(root, 'index.html'), (e2, idx) => {
                      if (e2) { res.writeHead(404); res.end('Not found'); return; }
                      res.writeHead(200, { 'Content-Type': 'text/html' });
                      res.end(idx);
                    });
                    return;
                  }
                  const ext = path.extname(file);
                  res.writeHead(200, { 'Content-Type': mime[ext] || 'application/octet-stream' });
                  res.end(data);
                });
              }).listen(port, () => console.log('Listening on port ' + port));
              EOF
            displayName: 'Generate static file server (staticserver.cjs)'

          # -------------------------------------------------------------------
          # Package the app — zip source + build artifacts, excluding
          # node_modules (App Service installs deps at startup via startup command)
          # -------------------------------------------------------------------
          - script: |
              cd $(System.DefaultWorkingDirectory)
              zip -r $(Build.ArtifactStagingDirectory)/frontend.zip . \
                --exclude="node_modules/*" \
                --exclude=".git/*" \
                --exclude=".gitignore" \
                --exclude="Azure-pipelines/*"
            displayName: 'Zip frontend artifact'

          - publish: '$(Build.ArtifactStagingDirectory)/frontend.zip'
            artifact: fd-poc-frontend
            displayName: 'Publish frontend artifact'

# =============================================================================
# STAGE 2: DEPLOY TO AZURE APP SERVICE
# =============================================================================
  - stage: Deploy
    displayName: 'Deploy Frontend to Azure App Service'
    dependsOn: Build
    # Deploy whenever build succeeds and runDeploy is true (any branch)
    condition: and(succeeded(), eq(variables['runDeploy'], 'true'))
    jobs:
      - deployment: DeployFrontend
        displayName: 'Deploy to Azure App Service'
        pool:
          vmImage: 'ubuntu-latest'
        environment: fd-dev
        timeoutInMinutes: 180
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: fd-poc-frontend
                  displayName: 'Download frontend artifact'

                - task: AzureWebApp@1
                  displayName: 'Deploy TanStack Start app to Azure App Service'
                  inputs:
                    azureSubscription: fd_ser_con
                    appType: 'webAppLinux'
                    appName: $(frontend-app-name)
                    resourceGroupName: $(frontend-resource-group)
                    package: '$(Pipeline.Workspace)/fd-poc-frontend/frontend.zip'
                    # Zero-dependency Node.js static server (generated during build stage)
                    startUpCommand: 'node staticserver.cjs'
                    appSettings: '-VITE_API_BASE_URL "$(eagle-backend-url)"'
