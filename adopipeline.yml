# =============================================================================
# fd-poc-backend-pipeline.yml
#
# ADO Pipeline: Build & Deploy fd_poc/backend (FastAPI) to Azure App Service
#
# Variable Group (ADO Library > Variable Groups): fd-group
# Variables inherited from the group:
#   $(subscription-id)       - Azure subscription ID
#   $(resource-group-name)   - Azure Resource Group name
#
# Inline variables (defined below — update before running):
#   backend-app-name         - Azure App Service name for the backend
#
# App Settings injected into Azure App Service at deploy time:
#   APP_NAME, APP_VERSION, API_PREFIX, API_VERSION_PREFIX, ALLOWED_ORIGINS
#   PGHOST, PGUSER, PGPORT, PGDATABASE, PGPASSWORD, PGSSLMODE
#   (store sensitive values like PGPASSWORD in ADO Variable Group as secret)
#
# Service Connection (ADO Project Settings > Service Connections):
#   fd_ser_con               - ARM service connection
# =============================================================================

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - apps/backend/**

pr:
  branches:
    include:
      - main

variables:
  # -------------------------------------------------------------------------
  # Variable group from ADO Library (Pipelines > Library > fd-group)
  # -------------------------------------------------------------------------
  - group: fd-group
  # -------------------------------------------------------------------------
  # App-specific variables — update once App Service is provisioned
  # -------------------------------------------------------------------------
  - name: backend-app-name
    value: 'eagle-backend01'
  - name: backend-resource-group
    value: 'backend-app-eagle_group'
  - name: pythonVersion
    value: '3.11'
  - name: runDeploy
    value: 'true'    # Deploy enabled

# =============================================================================
# STAGE 1: BUILD
# =============================================================================
stages:
  - stage: Build
    displayName: 'Build FastAPI Backend'
    jobs:
      - job: BuildBackend
        displayName: 'Install dependencies & run tests'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          # -------------------------------------------------------------------
          # Set up Python
          # -------------------------------------------------------------------
          - task: UsePythonVersion@0
            displayName: 'Use Python $(pythonVersion)'
            inputs:
              versionSpec: $(pythonVersion)
              addToPath: true

          # -------------------------------------------------------------------
          # Install dependencies from fd_poc/backend/requirements.txt
          # -------------------------------------------------------------------
          - script: |
              python -m pip install --upgrade pip
              pip install -r apps/backend/requirements.txt
            displayName: 'pip install requirements'

          # -------------------------------------------------------------------
          # Run tests (pytest inside fd_poc/backend/tests/)
          # Skip if no tests exist yet — remove '--ignore' once tests are added
          # -------------------------------------------------------------------
          - script: |
              pip install pytest
              pytest apps/backend/tests/ -v --tb=short || echo "No tests found or tests passed"
            displayName: 'Run tests (pytest)'
            continueOnError: true

          # -------------------------------------------------------------------
          # Wrap repo contents inside eagle_hackathon/ so absolute imports
          # (eagle_hackathon.apps.backend...) resolve correctly on App Service
          # Also creates any missing __init__.py files needed for package imports
          # -------------------------------------------------------------------
          - script: |
              set -e
              PKG=$(Build.BinariesDirectory)/package

              # Create eagle_hackathon wrapper directory
              mkdir -p $PKG/eagle_hackathon

              # Copy entire repo into it
              cp -r $(Build.SourcesDirectory)/. $PKG/eagle_hackathon/

              # Ensure all __init__.py files exist for package imports
              touch $PKG/eagle_hackathon/__init__.py
              touch $PKG/eagle_hackathon/apps/__init__.py
              touch $PKG/eagle_hackathon/apps/backend/__init__.py
              touch $PKG/eagle_hackathon/apps/backend/src/__init__.py
              touch $PKG/eagle_hackathon/apps/backend/src/core/__init__.py
              touch $PKG/eagle_hackathon/apps/backend/src/db/__init__.py
              touch $PKG/eagle_hackathon/apps/backend/src/routers/__init__.py
              touch $PKG/eagle_hackathon/apps/backend/src/scripts/__init__.py
              touch $PKG/eagle_hackathon/apps/backend/models/__init__.py
              touch $PKG/eagle_hackathon/apps/backend/services/__init__.py

              # Copy requirements.txt to package root for App Service auto-install
              cp $(Build.SourcesDirectory)/apps/backend/requirements.txt $PKG/requirements.txt

              # Create startup.sh — explicitly sets PYTHONPATH before uvicorn starts
              cat > $PKG/startup.sh << 'EOF'
              #!/bin/bash
              set -e
              export PYTHONPATH=/home/site/wwwroot
              echo "[startup] PYTHONPATH=$PYTHONPATH"
              echo "[startup] Python: $(python --version)"
              pip install -r /home/site/wwwroot/requirements.txt --quiet
              exec uvicorn eagle_hackathon.apps.backend.src.main:app --host 0.0.0.0 --port 8000
              EOF
              chmod +x $PKG/startup.sh
            displayName: 'Prepare deployment package structure'

          # -------------------------------------------------------------------
          # Package the app — zip the wrapped structure for App Service deployment
          # -------------------------------------------------------------------
          - task: ArchiveFiles@2
            displayName: 'Zip backend artifact'
            inputs:
              rootFolderOrFile: '$(Build.BinariesDirectory)/package'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/backend.zip'

          - publish: '$(Build.ArtifactStagingDirectory)/backend.zip'
            artifact: fd-poc-backend
            displayName: 'Publish backend artifact'

# =============================================================================
# STAGE 2: DEPLOY TO AZURE APP SERVICE
# =============================================================================
  - stage: Deploy
    displayName: 'Deploy FastAPI Backend to Azure App Service'
    dependsOn: Build
    # Deploy whenever build succeeds and runDeploy is true (any branch)
    condition: and(succeeded(), eq(variables['runDeploy'], 'true'))
    jobs:
      - deployment: DeployBackend
        displayName: 'Deploy to Azure App Service'
        pool:
          vmImage: 'ubuntu-latest'
        environment: fd-dev
        timeoutInMinutes: 180
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: fd-poc-backend
                  displayName: 'Download backend artifact'

                # -------------------------------------------------------------------
                # Fetch secrets from Azure Key Vault
                # Secrets are made available as pipeline variables using their
                # secret names (e.g. eagle-pg-host → $(eagle-pg-host))
                # -------------------------------------------------------------------
                - task: AzureKeyVault@2
                  displayName: 'Fetch secrets from Azure Key Vault (fd-eagle)'
                  inputs:
                    azureSubscription: fd_ser_con
                    KeyVaultName: 'fd-eagle'
                    SecretsFilter: 'eagle-pg-port,eagle-pg-host,eagle-pg-db,eagle-pg-user,eagle-pg-pwd'
                    RunAsPreJob: false

                - task: AzureWebApp@1
                  displayName: 'Deploy FastAPI app to Azure App Service'
                  inputs:
                    azureSubscription: fd_ser_con
                    appType: 'webAppLinux'
                    appName: $(backend-app-name)
                    resourceGroupName: $(backend-resource-group)
                    package: '$(Pipeline.Workspace)/fd-poc-backend/backend.zip'
                    # Startup command: run uvicorn pointing to the FastAPI app
                    # The module path matches the import structure in main.py
                    startUpCommand: 'bash /home/site/wwwroot/startup.sh'
                    appSettings: -APP_NAME "FlightDeck APIs" -APP_VERSION "1.0.0" -API_PREFIX "/api" -API_VERSION_PREFIX "/api/v1" -ALLOWED_ORIGINS "*" -PGPORT "$(eagle-pg-port)" -PGSSLMODE "require" -PGHOST "$(eagle-pg-host)" -PGUSER "$(eagle-pg-user)" -PGDATABASE "$(eagle-pg-db)" -PGPASSWORD "$(eagle-pg-pwd)" -PYTHONPATH "/home/site/wwwroot"
